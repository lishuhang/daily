title: "每日 AIGC 早报"
email: i@lishuhang.me
description: "每日 AIGC 早报"
baseurl: "/daily"
url: "https://lishuhang.me"

# 主站地址（用于"关于"等链接）
main_site: "https://lishuhang.me"

color: "#347df8"
logo: "/assets/logo.svg"
show_title: true

# Logo 和 Title 分别链接到不同地址（子站场景）
# logo_url: Logo 图片点击后跳转的地址（默认指向主站）
logo_url: "https://lishuhang.me/"
# title_url: 站名文字点击后跳转的地址（默认指向子站首页）
title_url: "/"

# Footer 左侧 credit（支持 Markdown）
credit: "© 2025 书航 [lishuhang.me](https://lishuhang.me)"

# 构建设置
markdown: kramdown
theme: null
permalink: /:year/:month/:day/
future: true

# 图片 CDN
weserv: "https://images.weserv.nl"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock


# ============================================================
# Image storage prefixes (v1.11, aligned with main blog)
# ============================================================
# Posts store relative paths: /YYYY/MM/MMDD-d.ext
# Plugin combines: prefix + path → full URL
image_prefixes:
  # range 采用 [起始月份, 截止月份)；prefix 供 Jekyll 展示，upload 供 keepitrun 写入。
  - range: [null, "2026-08"]
    prefix: "https://lishuhang.me/img/"
    upload:
      repository: "lishuhang/img"
      branch: "master"
      path_prefix: ""
  - range: ["2026-08", null]
    prefix: "https://lishuhang.me/img/"
    upload:
      repository: "lishuhang/img"
      branch: "master"
      path_prefix: ""

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
